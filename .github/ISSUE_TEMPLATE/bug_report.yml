name: Bug report
description: Something doesn't work or shows wrong values
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the **diagnostics file**
        (Settings → Devices & services → Green Cell UPS → ⋮ → Download diagnostics).
        The password is redacted automatically.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what did you get instead?
    validations:
      required: true
  - type: input
    id: ups
    attributes:
      label: UPS model
      placeholder: Green Cell UPS04 1500VA 900W
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: GC UPS App version + OS (or Docker image)
      placeholder: 1.1.7 on Windows 11 / ghcr.io/fajfer/gcups:1.1.7
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.2"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: Drag the diagnostics JSON here, and paste relevant log lines (custom_components.greencell_ups).
